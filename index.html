<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f3f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1 id="title">Ledger</h1>
      <button class="icon-btn" id="btn-card" aria-label="Which card should I use?"></button>
      <button class="icon-btn" id="btn-hide" aria-label="Hide amounts"></button>
      <button class="icon-btn" id="btn-refresh" aria-label="Refresh prices" hidden></button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings"></button>
    </div>
  </header>
  <main class="wrap" id="main"></main>
  <button class="fab" id="fab" aria-label="Add transaction" hidden></button>
  <nav class="tabbar" aria-label="Sections"><div class="wrap" id="tabbar"></div></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><p style="padding:24px">Ledger needs JavaScript.</p></noscript>
  <script type="module">
    import { ICON } from './src/ui.js';
    document.getElementById('btn-card').innerHTML = ICON.spending;
    document.getElementById('btn-refresh').innerHTML = ICON.refresh;
    document.getElementById('btn-settings').innerHTML = ICON.gear;
    document.getElementById('fab').innerHTML = ICON.plus;
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
