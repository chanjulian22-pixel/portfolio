<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f3f5f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0e13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root {
    --bg: #f3f5f8;
    --card: #ffffff;
    --ink: #0d1520;
    --muted: #64748b;
    --line: #e4e9f0;
    --chip: #e6ebf2;
    --field: #f3f5f8;
    --accent: #2563eb;
    --accent-ink: #ffffff;
    --up: #15803d;
    --down: #c62828;
    --warn: #b45309;
    --backdrop: rgba(15, 23, 42, .45);
    --header: rgba(243, 245, 248, .86);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0e13;
      --card: #131a22;
      --ink: #e7edf4;
      --muted: #8b98a9;
      --line: #222c38;
      --chip: #1c2531;
      --field: #0d1218;
      --accent: #5b9bff;
      --accent-ink: #06101f;
      --up: #34c759;
      --down: #ff5a52;
      --warn: #f0a43a;
      --backdrop: rgba(0, 0, 0, .6);
      --header: rgba(10, 14, 19, .86);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  a { color: var(--accent); }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }

  /* Header */
  .top {
    position: sticky; top: 0; z-index: 10;
    padding-top: env(safe-area-inset-top);
    background: var(--header);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 2px; padding-top: 8px; }
  .bar h1 { flex: 1; margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .icon {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 0; border-radius: 10px; background: transparent; color: var(--ink);
  }
  .icon:active { background: var(--chip); }
  .icon svg { width: 22px; height: 22px; }
  .spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto;
    margin: 0 -16px; padding: 8px 16px 10px; scroll-padding: 0 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 0; border-radius: 999px; padding: 7px 14px;
    background: var(--chip); color: var(--ink); font-size: 15px; font-weight: 500; white-space: nowrap;
  }
  .chip.on { background: var(--ink); color: var(--bg); }

  /* Summary */
  main { padding-top: 4px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
  .hero { padding: 16px 0 20px; }
  .hero-label { color: var(--muted); font-size: 14px; font-weight: 500; }
  .hero-total { margin: 2px 0 4px; font-size: 40px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
  .hero-chg { font-size: 16px; font-weight: 600; }
  .stamp { margin-top: 6px; color: var(--muted); font-size: 13px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat, .muted { color: var(--muted); }
  .warn { color: var(--warn); }

  /* Lists */
  .card { background: var(--card); border-radius: 14px; padding: 2px 16px; margin-bottom: 16px; }
  .card-h { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 2px; }
  .card-h h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .card-h span { font-size: 13px; color: var(--muted); }
  .item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 12px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left;
  }
  .card-h + .item { border-top: 0; }
  button.item:active { opacity: .55; }
  .item-main { display: block; flex: 1; min-width: 0; }
  .item-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; font-weight: 600; }
  .item-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 400; color: var(--muted); }
  .item-sub { display: block; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .item-end { display: block; flex: none; min-width: 104px; text-align: right; }
  .item-val { display: block; font-weight: 600; }
  .item-chg { display: block; margin-top: 1px; font-size: 13px; }
  .alloc { display: block; height: 4px; margin-top: 8px; border-radius: 2px; background: var(--chip); overflow: hidden; }
  .alloc i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
  .chev { flex: none; color: var(--muted); }
  .chev svg { width: 16px; height: 16px; display: block; }

  .btn-wide {
    display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
    padding: 14px; border: 0; border-radius: 14px; background: var(--card); color: var(--accent); font-weight: 600;
  }
  .btn-wide svg { width: 18px; height: 18px; }
  .notice { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; font-size: 15px; }
  .notice p { margin: 0 0 12px; }
  .notice p:last-child { margin: 0; }

  /* Sheets */
  dialog.sheet {
    width: min(560px, calc(100% - 24px));
    max-height: calc(100% - 24px - env(safe-area-inset-top));
    margin: calc(12px + env(safe-area-inset-top)) auto auto;
    padding: 20px; border: 0; border-radius: 16px;
    background: var(--card); color: var(--ink); overflow: auto;
  }
  dialog.sheet::backdrop { background: var(--backdrop); }
  .sheet h2 { margin: 0; font-size: 20px; }
  .sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet .sub { margin: 2px 0 16px; color: var(--muted); font-size: 14px; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .field em { font-style: normal; font-weight: 400; }
  .field input, .inline input, .acct-row input {
    width: 100%; min-width: 0; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--field); font-size: 16px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.masked:not(:focus) { -webkit-text-security: disc; }
  .check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; font-size: 15px; }
  .check input { flex: none; width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--accent); }
  .hint { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .hint:empty { display: none; }
  .err { margin: 0 0 12px; font-size: 14px; color: var(--down); }
  .err:empty { display: none; }
  .actions-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .spacer { flex: 1; }
  .btn { flex: none; border: 0; border-radius: 10px; padding: 11px 16px; background: var(--chip); font-size: 16px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.danger { background: transparent; color: var(--down); }
  .btn.small { padding: 8px 12px; font-size: 15px; }
  .inline { display: flex; gap: 8px; margin-bottom: 8px; }
  .inline input { flex: 1; }
  .sec { margin-top: 24px; }
  .sec h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .acct-row { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
  .acct-row input { flex: 1; }

  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 50;
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px;
    background: var(--ink); color: var(--bg); font-size: 14px; text-align: center;
    opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--down); color: #fff; }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <h1>Portfolio</h1>
      <button class="icon" id="btnHide" aria-label="Hide amounts" aria-pressed="false"></button>
      <button class="icon" id="btnRefresh" aria-label="Refresh prices"></button>
      <button class="icon" id="btnSettings" aria-label="Settings"></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Accounts"></nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog class="sheet" id="dlgHolding" aria-labelledby="hTitle">
  <form id="fHolding" novalidate>
    <h2 id="hTitle">Add holding</h2>
    <p class="sub" id="hSub"></p>
    <label class="field"><span>Ticker</span>
      <input name="ticker" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="15" placeholder="e.g. VOO"></label>
    <label class="field"><span>Shares</span>
      <input name="shares" inputmode="decimal" autocomplete="off" placeholder="0"></label>
    <label class="check"><input type="checkbox" name="manual">
      <span>No live quote (e.g. a 401(k) trust fund). I'll enter the price myself.</span></label>
    <div id="hManual" hidden>
      <label class="field"><span>Price per share</span>
        <input name="price" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
    </div>
    <label class="field"><span>Name <em>(optional)</em></span>
      <input name="label" autocomplete="off" maxlength="60" placeholder="e.g. Vanguard S&amp;P 500 ETF"></label>
    <p class="hint">Price and name are shared by this ticker across all your accounts.</p>
    <p class="err" id="hErr" role="alert"></p>
    <div class="actions-row">
      <button type="button" class="btn danger" id="hDelete">Remove</button>
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="dlgCash" aria-labelledby="cTitle">
  <form id="fCash" novalidate>
    <h2 id="cTitle">Cash balance</h2>
    <p class="sub" id="cSub"></p>
    <label class="field"><span>Amount ($)</span>
      <input name="cash" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
    <p class="err" id="cErr" role="alert"></p>
    <div class="actions-row">
      <span class="spacer"></span>
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<dialog class="sheet" id="dlgSettings" aria-labelledby="sTitle">
  <div class="sheet-h">
    <h2 id="sTitle">Settings</h2>
    <button type="button" class="btn small" data-close>Done</button>
  </div>
  <section class="sec">
    <h3>Finnhub API key</h3>
    <p class="hint">Free at <a href="https://finnhub.io/register" target="_blank" rel="noopener">finnhub.io</a>. Saved only on this device.</p>
    <div class="inline">
      <input id="keyInput" class="masked" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste your key">
      <button type="button" class="btn primary" id="keySave">Save</button>
    </div>
    <p class="hint" id="keyStatus"></p>
  </section>
  <section class="sec">
    <h3>Accounts</h3>
    <div id="acctList"></div>
    <button type="button" class="btn small" id="acctAdd">+ Add account</button>
  </section>
  <section class="sec">
    <h3>Backup</h3>
    <p class="hint">Your holdings are stored only on this phone. Export a backup to Files now and then.</p>
    <div class="inline">
      <button type="button" class="btn" id="btnExport">Export backup</button>
      <button type="button" class="btn" id="btnImport">Import backup</button>
    </div>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </section>
</dialog>

<script>
(() => {
  'use strict';

  // ---------- storage ----------
  const K = { state: 'pt.state.v1', quotes: 'pt.quotes.v1', key: 'pt.finnhubKey', ui: 'pt.ui.v1' };
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  };

  const DEFAULT_ACCOUNTS = [
    { id: 'roth', name: 'Roth IRA' },
    { id: 'taxable', name: 'Taxable' },
    { id: '401k', name: '401(k)' },
    { id: 'savings', name: 'Savings' },
  ];

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const toNum = v => typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(/[$,\s]/g, ''));
  const isNum = v => typeof v === 'number' && Number.isFinite(v);
  const normTicker = t => {
    const s = String(t ?? '').trim().toUpperCase().replace(/\s+/g, '');
    return /^[A-Z0-9][A-Z0-9.\-]{0,14}$/.test(s) ? s : '';
  };
  const newId = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    eye: svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
    eyeOff: svg('<path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>'),
    refresh: svg('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
    sliders: svg('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'),
    plus: svg('<path d="M12 5v14M5 12h14"/>'),
    chev: svg('<path d="M9 6l6 6-6 6"/>'),
  };

  // Accepts anything (saved state or an imported backup) and returns a clean copy, or null.
  function sanitize(s) {
    if (!s || typeof s !== 'object' || !Array.isArray(s.accounts)) return null;
    const ids = new Set();
    const accounts = s.accounts.filter(a => a && typeof a === 'object').map(a => {
      let id = typeof a.id === 'string' && a.id ? a.id.slice(0, 40) : newId();
      while (ids.has(id)) id = newId();
      ids.add(id);
      const seen = new Set(), holdings = [];
      for (const h of Array.isArray(a.holdings) ? a.holdings : []) {
        const ticker = normTicker(h && h.ticker), shares = toNum(h && h.shares);
        if (!ticker || !isNum(shares) || shares < 0 || seen.has(ticker)) continue;
        seen.add(ticker);
        holdings.push({ ticker, shares });
      }
      const cash = toNum(a.cash);
      const name = typeof a.name === 'string' && a.name.trim() ? a.name.trim().slice(0, 40) : 'Account';
      return { id, name, cash: isNum(cash) && cash > 0 ? cash : 0, holdings };
    });
    const meta = {};
    if (s.meta && typeof s.meta === 'object') {
      for (const [t, m] of Object.entries(s.meta)) {
        const tk = normTicker(t);
        if (!tk || !m || typeof m !== 'object') continue;
        const e = {};
        if (isNum(m.manual) && m.manual >= 0) e.manual = m.manual;
        if (typeof m.label === 'string' && m.label.trim()) e.label = m.label.trim().slice(0, 60);
        if (Object.keys(e).length) meta[tk] = e;
      }
    }
    return { accounts, meta };
  }

  // ---------- state ----------
  let state = sanitize(store.get(K.state, null))
    || { accounts: DEFAULT_ACCOUNTS.map(a => ({ ...a, cash: 0, holdings: [] })), meta: {} };
  let quotes = store.get(K.quotes, {});
  if (!quotes || typeof quotes !== 'object') quotes = {};
  let apiKey = String(store.get(K.key, '') || '');
  const ui = Object.assign({ tab: 'all', hidden: false, lastRefresh: 0 }, store.get(K.ui, {}));
  let refreshing = false, lastAttempt = 0, keyRejected = false;

  const save = () => store.set(K.state, state);
  const saveUi = () => store.set(K.ui, ui);
  const acctById = id => state.accounts.find(a => a.id === id);

  function pruneMeta() {
    const held = new Set(state.accounts.flatMap(a => a.holdings.map(h => h.ticker)));
    for (const t of Object.keys(state.meta)) if (!held.has(t)) delete state.meta[t];
    for (const t of Object.keys(quotes)) if (!held.has(t)) delete quotes[t];
    store.set(K.quotes, quotes);
  }

  function liveTickers() {
    const set = new Set();
    for (const a of state.accounts) for (const h of a.holdings) if (!isNum(state.meta[h.ticker]?.manual)) set.add(h.ticker);
    return [...set];
  }

  function priceOf(t) {
    const m = state.meta[t];
    if (m && isNum(m.manual)) return { price: m.manual, manual: true };
    const q = quotes[t];
    if (q && q.c > 0) return { price: q.c, d: q.d || 0, dp: q.dp || 0, live: true };
    return null;
  }

  function totals(a) {
    let value = a.cash, day = 0, missing = 0;
    for (const h of a.holdings) {
      const p = priceOf(h.ticker);
      if (!p) { missing++; continue; }
      value += h.shares * p.price;
      if (p.live) day += h.shares * p.d;
    }
    return { value, day, missing };
  }

  // ---------- formatting ----------
  const usdFmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  const pxFmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 4 });
  const shFmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 4 });
  const MASK = '••••';
  const sign = v => Math.abs(v) < 0.005 ? '' : v < 0 ? '−' : '+';
  const money = v => ui.hidden ? '$' + MASK : usdFmt.format(v);
  const shares = v => ui.hidden ? MASK : shFmt.format(v);
  const signedMoney = v => ui.hidden ? MASK : sign(v) + usdFmt.format(Math.abs(v));
  const signedPct = v => sign(v) + Math.abs(v).toFixed(2) + '%';
  const tone = v => v > 0.004 ? 'up' : v < -0.004 ? 'down' : 'flat';

  function fmtTime(ms) {
    const d = new Date(ms), now = new Date();
    const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    return d.toDateString() === now.toDateString() ? time : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + time;
  }
  function ago(ms) {
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60);
    return h < 24 ? h + ' hr ago' : fmtTime(ms);
  }
  function stampText() {
    if (!apiKey) return '';
    if (refreshing && !ui.lastRefresh) return 'Loading prices…';
    let t = 0;
    for (const tk of liveTickers()) { const q = quotes[tk]; if (q && q.c > 0 && q.t > t) t = q.t; }
    const parts = [];
    if (t) parts.push('Prices as of ' + fmtTime(t * 1000));
    if (ui.lastRefresh) parts.push((parts.length ? 'updated ' : 'Updated ') + ago(ui.lastRefresh));
    return parts.join(' · ');
  }

  // ---------- views ----------
  function hero(label, t) {
    const base = t.value - t.day;
    const pct = base > 0 ? (t.day / base) * 100 : 0;
    const stamp = stampText();
    return `<section class="hero">
      <div class="hero-label">${esc(label)}</div>
      <div class="hero-total">${money(t.value)}</div>
      <div class="hero-chg ${tone(t.day)}">${signedMoney(t.day)} (${signedPct(pct)}) <span class="muted">today</span></div>
      <div class="stamp" id="stamp">${esc(stamp)}</div>
    </section>`;
  }

  function notice(missing) {
    if (!apiKey) {
      return `<div class="notice"><p><strong>Connect live prices.</strong> Add your free Finnhub API key to pull current stock and ETF prices.</p>
        <button class="btn primary small" data-action="settings">Open settings</button></div>`;
    }
    if (missing && ui.lastRefresh && !refreshing) {
      return `<div class="notice"><p>${missing} holding${missing > 1 ? 's have' : ' has'} no price. Tap ${missing > 1 ? 'them' : 'it'} to enter a price manually.</p></div>`;
    }
    return '';
  }

  function priceEnd(p, sh, value, withDollar) {
    if (!p) {
      return `<span class="item-val muted">—</span><span class="item-chg ${refreshing ? 'muted' : 'warn'}">${refreshing ? 'Loading…' : 'No price'}</span>`;
    }
    if (p.manual) return `<span class="item-val">${money(value)}</span><span class="item-chg muted">Manual price</span>`;
    const dollar = withDollar ? signedMoney(sh * p.d) + ' · ' : '';
    return `<span class="item-val">${money(value)}</span><span class="item-chg ${tone(p.d)}">${dollar}${signedPct(p.dp)}</span>`;
  }

  const labelHtml = t => { const l = state.meta[t]?.label; return l ? `<span class="item-label">${esc(l)}</span>` : ''; };
  const byValue = (x, y) => (y.value ?? -1) - (x.value ?? -1) || x.ticker.localeCompare(y.ticker);

  function acctSummary(a) {
    const n = a.holdings.length;
    if (!n) return a.cash > 0 ? 'Cash' : 'Empty — tap to add holdings';
    return `${n} holding${n > 1 ? 's' : ''}${a.cash > 0 ? ' + cash' : ''}`;
  }

  function viewAll() {
    const grand = { value: 0, day: 0 };
    const accts = state.accounts.map(a => {
      const t = totals(a);
      grand.value += t.value;
      grand.day += t.day;
      return { a, t };
    });

    // Roll the same ticker up across accounts.
    const byTicker = new Map();
    let cash = 0;
    const cashBy = [];
    for (const a of state.accounts) {
      if (a.cash > 0) { cash += a.cash; cashBy.push(a); }
      for (const h of a.holdings) {
        let e = byTicker.get(h.ticker);
        if (!e) byTicker.set(h.ticker, e = { ticker: h.ticker, shares: 0, by: [] });
        e.shares += h.shares;
        e.by.push({ a, shares: h.shares });
      }
    }
    const rows = [...byTicker.values()].map(e => {
      const p = priceOf(e.ticker);
      return { ...e, p, value: p ? e.shares * p.price : null };
    }).sort(byValue);
    const pctOf = v => grand.value > 0 ? (v / grand.value) * 100 : 0;

    let html = hero('All accounts', grand) + notice(rows.filter(r => !r.p).length);

    html += `<section class="card"><div class="card-h"><h2>Accounts</h2></div>`;
    for (const { a, t } of accts) {
      html += `<button class="item" data-tab="${esc(a.id)}">
        <span class="item-main"><span class="item-title">${esc(a.name)}</span><span class="item-sub">${acctSummary(a)}</span></span>
        <span class="item-end"><span class="item-val">${money(t.value)}</span><span class="item-chg ${tone(t.day)}">${signedMoney(t.day)}</span></span>
        <span class="chev">${ICON.chev}</span>
      </button>`;
    }
    html += `</section>`;

    if (!rows.length && !cash) {
      return html + `<div class="notice"><p>Pick an account tab above, then tap <strong>Add holding</strong> to enter your shares.</p></div>`;
    }

    html += `<section class="card"><div class="card-h"><h2>All holdings</h2><span>combined</span></div>`;
    for (const r of rows) {
      const pct = r.value != null ? pctOf(r.value) : null;
      const where = r.by.map(b => `${esc(b.a.name)} ${shares(b.shares)}`).join(' · ');
      html += `<button class="item" data-action="edit-holding" data-acct="${esc(r.by[0].a.id)}" data-ticker="${esc(r.ticker)}">
        <span class="item-main">
          <span class="item-title">${esc(r.ticker)}${labelHtml(r.ticker)}</span>
          <span class="item-sub">${shares(r.shares)} sh${pct != null ? ' · ' + pct.toFixed(1) + '% of total' : ''}</span>
          <span class="item-sub">${where}</span>
          ${pct != null ? `<span class="alloc"><i style="width:${pct.toFixed(2)}%"></i></span>` : ''}
        </span>
        <span class="item-end">${priceEnd(r.p, r.shares, r.value, false)}</span>
      </button>`;
    }
    if (cash > 0) {
      const pct = pctOf(cash);
      html += `<div class="item">
        <span class="item-main">
          <span class="item-title">Cash</span>
          <span class="item-sub">${pct.toFixed(1)}% of total</span>
          <span class="item-sub">${cashBy.map(a => `${esc(a.name)} ${money(a.cash)}`).join(' · ')}</span>
          <span class="alloc"><i style="width:${pct.toFixed(2)}%"></i></span>
        </span>
        <span class="item-end"><span class="item-val">${money(cash)}</span><span class="item-chg muted">—</span></span>
      </div>`;
    }
    return html + `</section>`;
  }

  function viewAccount(a) {
    const t = totals(a);
    const rows = a.holdings.map(h => {
      const p = priceOf(h.ticker);
      return { ...h, p, value: p ? h.shares * p.price : null };
    }).sort(byValue);

    let html = hero(a.name, t) + notice(t.missing);
    html += `<section class="card"><div class="card-h"><h2>Holdings</h2><span>${rows.length || ''}</span></div>`;
    for (const r of rows) {
      const sub = r.p ? `${shares(r.shares)} sh × ${pxFmt.format(r.p.price)}` : `${shares(r.shares)} sh`;
      html += `<button class="item" data-action="edit-holding" data-acct="${esc(a.id)}" data-ticker="${esc(r.ticker)}">
        <span class="item-main"><span class="item-title">${esc(r.ticker)}${labelHtml(r.ticker)}</span><span class="item-sub">${sub}</span></span>
        <span class="item-end">${priceEnd(r.p, r.shares, r.value, true)}</span>
      </button>`;
    }
    html += `<button class="item" data-action="edit-cash" data-acct="${esc(a.id)}">
      <span class="item-main"><span class="item-title">Cash</span><span class="item-sub">${a.cash > 0 ? 'Tap to update' : 'Tap to add a balance'}</span></span>
      <span class="item-end"><span class="item-val">${money(a.cash)}</span></span>
    </button></section>`;
    html += `<button class="btn-wide" data-action="add-holding" data-acct="${esc(a.id)}">${ICON.plus} Add holding</button>`;
    return html;
  }

  const $main = $('#main'), $tabs = $('#tabs'), $hide = $('#btnHide'), $refresh = $('#btnRefresh');

  function render() {
    if (ui.tab !== 'all' && !acctById(ui.tab)) ui.tab = 'all';
    const tabs = [{ id: 'all', name: 'All' }, ...state.accounts];
    $tabs.innerHTML = tabs.map(t => {
      const on = t.id === ui.tab;
      return `<button class="chip${on ? ' on' : ''}" role="tab" aria-selected="${on}" data-tab="${esc(t.id)}">${esc(t.name)}</button>`;
    }).join('');
    $main.innerHTML = ui.tab === 'all' ? viewAll() : viewAccount(acctById(ui.tab));
    $hide.innerHTML = ui.hidden ? ICON.eyeOff : ICON.eye;
    $hide.setAttribute('aria-pressed', String(ui.hidden));
    $hide.setAttribute('aria-label', ui.hidden ? 'Show amounts' : 'Hide amounts');
  }

  function setTab(id) {
    ui.tab = id;
    saveUi();
    render();
    window.scrollTo(0, 0);
    $tabs.querySelector('.on')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  let toastTimer;
  function toast(msg, isErr) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.toggle('err', !!isErr);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3800);
  }

  // ---------- prices (Finnhub) ----------
  const quoteUrl = (sym, key) => `https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${encodeURIComponent(key)}`;

  // opts.manual: user tapped refresh. opts.only: just these tickers. opts.quiet: background refresh.
  async function refreshQuotes(opts = {}) {
    if (refreshing) return;
    if (!apiKey) { if (opts.manual) toast('Add your Finnhub API key in Settings first.'); return; }
    const list = opts.only || liveTickers();
    if (!list.length) { if (opts.manual) toast('Add a holding to see live prices.'); return; }

    refreshing = true;
    lastAttempt = Date.now();
    $refresh.classList.add('spin');
    render();

    const queue = list.slice(), missing = [];
    let ok = 0, netErr = 0, stop = null;
    const worker = async () => {
      while (queue.length && !stop) {
        const sym = queue.shift();
        try {
          const r = await fetch(quoteUrl(sym, apiKey), { cache: 'no-store' });
          if (r.status === 401) { stop = 'auth'; break; }
          if (r.status === 429) { stop = 'rate'; break; }
          if (r.status >= 500) { netErr++; continue; }
          const j = r.ok ? await r.json() : null;   // 403 = symbol not covered by the free plan
          if (j && isNum(j.c) && j.c > 0) {
            const d = isNum(j.d) ? j.d : 0, pc = isNum(j.pc) ? j.pc : 0;
            quotes[sym] = { c: j.c, d, dp: isNum(j.dp) ? j.dp : (pc > 0 ? (d / pc) * 100 : 0), pc, t: isNum(j.t) ? j.t : 0 };
            ok++;
          } else {
            delete quotes[sym];
            missing.push(sym);
          }
        } catch {
          netErr++;
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(4, list.length) }, worker));

    refreshing = false;
    $refresh.classList.remove('spin');
    store.set(K.quotes, quotes);
    if (ok || missing.length) { ui.lastRefresh = Date.now(); saveUi(); }
    keyRejected = stop === 'auth';
    render();

    if (stop === 'auth') toast('Finnhub rejected your API key. Check it in Settings.', true);
    else if (stop === 'rate') { if (!opts.quiet) toast('Finnhub rate limit hit. Try again in a minute.', true); }
    else if (netErr && !ok) { if (!opts.quiet) toast('Couldn’t reach Finnhub. Showing last saved prices.', true); }
    else if (missing.length && (opts.manual || opts.only)) toast(`No live quote for ${missing.join(', ')}. Tap it to enter a price.`);
    else if (opts.manual) toast('Prices updated');
  }

  // Background refresh while the app is open, kept under Finnhub's 60 calls/minute.
  setInterval(() => {
    if (document.visibilityState !== 'visible' || !apiKey || keyRejected || refreshing) return;
    const every = Math.max(60000, liveTickers().length * 1100);
    if (Date.now() - lastAttempt >= every) refreshQuotes({ quiet: true });
    else { const s = $('#stamp'); if (s) s.textContent = stampText(); }
  }, 15000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && apiKey && !keyRejected && Date.now() - lastAttempt > 30000) refreshQuotes({ quiet: true });
  });

  // ---------- holding sheet ----------
  const dH = $('#dlgHolding'), fH = $('#fHolding'), hEl = fH.elements;
  let hCtx = null;
  const syncManual = () => { $('#hManual').hidden = !hEl.manual.checked; };

  function openHolding(acctId, ticker) {
    const a = acctById(acctId);
    if (!a) return;
    const h = ticker ? a.holdings.find(x => x.ticker === ticker) : null;
    const m = (h && state.meta[h.ticker]) || {};
    hCtx = { acctId, ticker: h ? h.ticker : null };
    hEl.ticker.value = h ? h.ticker : '';
    hEl.shares.value = h ? String(h.shares) : '';
    hEl.manual.checked = isNum(m.manual);
    hEl.price.value = isNum(m.manual) ? String(m.manual) : '';
    hEl.label.value = m.label || '';
    syncManual();
    $('#hTitle').textContent = h ? `Edit ${h.ticker}` : 'Add holding';
    $('#hSub').textContent = a.name;
    $('#hDelete').hidden = !h;
    $('#hErr').textContent = '';
    dH.showModal();
    (h ? hEl.shares : hEl.ticker).focus();
  }

  hEl.manual.addEventListener('change', () => { syncManual(); if (hEl.manual.checked) hEl.price.focus(); });

  // When adding a ticker you already hold elsewhere, carry over its name and manual price.
  hEl.ticker.addEventListener('change', () => {
    const tk = normTicker(hEl.ticker.value);
    if (tk) hEl.ticker.value = tk;
    const m = state.meta[tk];
    if (!hCtx || hCtx.ticker || !m) return;
    if (!hEl.label.value && m.label) hEl.label.value = m.label;
    if (isNum(m.manual) && !hEl.manual.checked) { hEl.manual.checked = true; hEl.price.value = String(m.manual); syncManual(); }
  });

  fH.addEventListener('submit', e => {
    e.preventDefault();
    const err = msg => { $('#hErr').textContent = msg; };
    const a = acctById(hCtx.acctId);
    if (!a) return dH.close();
    const tk = normTicker(hEl.ticker.value);
    if (!tk) return err('Enter a ticker symbol, like VOO or AAPL.');
    const sh = toNum(hEl.shares.value);
    if (!isNum(sh) || sh < 0) return err('Enter how many shares you own.');
    if (tk !== hCtx.ticker && a.holdings.some(x => x.ticker === tk)) return err(`${tk} is already in ${a.name}. Edit that row instead.`);
    let manual = null;
    if (hEl.manual.checked) {
      manual = toNum(hEl.price.value);
      if (!isNum(manual) || manual < 0) return err('Enter the price per share.');
    }

    const h = hCtx.ticker && a.holdings.find(x => x.ticker === hCtx.ticker);
    if (h) { h.ticker = tk; h.shares = sh; } else a.holdings.push({ ticker: tk, shares: sh });

    const m = { ...state.meta[tk] };
    if (manual != null) m.manual = manual; else delete m.manual;
    const label = hEl.label.value.trim().slice(0, 60);
    if (label) m.label = label; else delete m.label;
    if (Object.keys(m).length) state.meta[tk] = m; else delete state.meta[tk];

    pruneMeta();
    save();
    dH.close();
    render();
    if (manual == null && !(quotes[tk] && quotes[tk].c > 0)) refreshQuotes({ only: [tk] });
  });

  $('#hDelete').addEventListener('click', () => {
    const a = acctById(hCtx.acctId);
    if (!a || !hCtx.ticker || !confirm(`Remove ${hCtx.ticker} from ${a.name}?`)) return;
    a.holdings = a.holdings.filter(x => x.ticker !== hCtx.ticker);
    pruneMeta();
    save();
    dH.close();
    render();
  });

  // ---------- cash sheet ----------
  const dC = $('#dlgCash'), fC = $('#fCash');
  let cAcct = null;
  function openCash(acctId) {
    const a = acctById(acctId);
    if (!a) return;
    cAcct = acctId;
    fC.elements.cash.value = a.cash ? String(a.cash) : '';
    $('#cSub').textContent = a.name;
    $('#cErr').textContent = '';
    dC.showModal();
    fC.elements.cash.focus();
  }
  fC.addEventListener('submit', e => {
    e.preventDefault();
    const a = acctById(cAcct);
    if (!a) return dC.close();
    const raw = fC.elements.cash.value.trim();
    const v = raw === '' ? 0 : toNum(raw);
    if (!isNum(v) || v < 0) { $('#cErr').textContent = 'Enter a dollar amount, like 2500 or 2,500.00.'; return; }
    a.cash = Math.round(v * 100) / 100;
    save();
    dC.close();
    render();
  });

  // ---------- settings sheet ----------
  const dS = $('#dlgSettings');
  function openSettings() {
    $('#keyInput').value = apiKey;
    $('#keyStatus').textContent = apiKey ? (keyRejected ? 'Finnhub rejected this key.' : 'Key saved on this device.') : '';
    renderAcctList();
    dS.showModal();
  }

  function renderAcctList() {
    $('#acctList').innerHTML = state.accounts.map(a => `<div class="acct-row">
        <input value="${esc(a.name)}" data-rename="${esc(a.id)}" maxlength="40" aria-label="Account name">
        <button type="button" class="btn small danger" data-action="del-acct" data-acct="${esc(a.id)}">Delete</button>
      </div>`).join('') || '<p class="hint">No accounts yet.</p>';
  }

  $('#acctList').addEventListener('change', e => {
    const a = acctById(e.target.dataset.rename);
    if (!a) return;
    const name = e.target.value.trim().slice(0, 40);
    if (!name) { e.target.value = a.name; return; }
    a.name = name;
    save();
    render();
  });

  $('#acctAdd').addEventListener('click', () => {
    const a = { id: newId(), name: 'New account', cash: 0, holdings: [] };
    state.accounts.push(a);
    save();
    render();
    renderAcctList();
    const input = $(`#acctList [data-rename="${a.id}"]`);
    input.focus();
    input.select();
  });

  function deleteAccount(id) {
    const a = acctById(id);
    if (!a) return;
    const msg = a.holdings.length || a.cash ? `Delete ${a.name} and everything in it?` : `Delete ${a.name}?`;
    if (!confirm(msg)) return;
    state.accounts = state.accounts.filter(x => x !== a);
    pruneMeta();
    save();
    render();
    renderAcctList();
  }

  async function checkKey(k) {
    try {
      const r = await fetch(quoteUrl('SPY', k), { cache: 'no-store' });
      if (r.status === 401) return { ok: false, msg: 'Finnhub rejected this key. Copy it again from your Finnhub dashboard.' };
      if (r.status === 429) return { ok: true, msg: 'Key saved. Finnhub says too many requests, so wait a minute.' };
      if (!r.ok) return { ok: true, msg: `Key saved, but Finnhub answered with error ${r.status}.` };
      return { ok: true, msg: 'Key works. Prices are updating.' };
    } catch {
      return { ok: true, msg: 'Key saved, but Finnhub couldn’t be reached. Check your connection.' };
    }
  }

  async function saveKey() {
    const k = $('#keyInput').value.trim();
    const status = $('#keyStatus');
    apiKey = k;
    store.set(K.key, k);
    keyRejected = false;
    if (!k) { status.textContent = 'Key removed.'; render(); return; }
    status.textContent = 'Checking key…';
    const res = await checkKey(k);
    status.textContent = res.msg;
    keyRejected = !res.ok;
    render();
    if (res.ok) refreshQuotes({ quiet: true });
  }
  $('#keySave').addEventListener('click', saveKey);
  $('#keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); saveKey(); } });

  $('#btnExport').addEventListener('click', async () => {
    const data = JSON.stringify({ app: 'portfolio', version: 1, exported: new Date().toISOString(), accounts: state.accounts, meta: state.meta }, null, 2);
    const name = `portfolio-backup-${new Date().toISOString().slice(0, 10)}.json`;
    const file = new File([data], name, { type: 'application/json' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(file);
    const link = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  });

  $('#btnImport').addEventListener('click', () => $('#fileImport').click());
  $('#fileImport').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let parsed;
    try { parsed = JSON.parse(await file.text()); } catch { alert('That file isn’t a valid backup.'); return; }
    const clean = sanitize(parsed);
    if (!clean) { alert('That file isn’t a portfolio backup.'); return; }
    const n = clean.accounts.reduce((s, a) => s + a.holdings.length, 0);
    if (!confirm(`Replace everything on this device with this backup (${clean.accounts.length} accounts, ${n} holdings)?`)) return;
    state = clean;
    pruneMeta();
    save();
    ui.tab = 'all';
    saveUi();
    render();
    renderAcctList();
    refreshQuotes();
  });

  // ---------- wiring ----------
  document.addEventListener('click', e => {
    const close = e.target.closest('[data-close]');
    if (close) { close.closest('dialog').close(); return; }
    const tab = e.target.closest('[data-tab]');
    if (tab) { setTab(tab.dataset.tab); return; }
    const act = e.target.closest('[data-action]');
    if (!act) return;
    const { action, acct, ticker } = act.dataset;
    if (action === 'edit-holding') openHolding(acct, ticker);
    else if (action === 'add-holding') openHolding(acct, null);
    else if (action === 'edit-cash') openCash(acct);
    else if (action === 'settings') openSettings();
    else if (action === 'del-acct') deleteAccount(acct);
  });

  // Tap outside a sheet to close it.
  for (const d of [dH, dC, dS]) {
    d.addEventListener('click', e => {
      if (e.target !== d) return;
      const r = d.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
    });
  }

  $refresh.innerHTML = ICON.refresh;
  $('#btnSettings').innerHTML = ICON.sliders;
  $refresh.addEventListener('click', () => refreshQuotes({ manual: true }));
  $('#btnSettings').addEventListener('click', openSettings);
  $hide.addEventListener('click', () => { ui.hidden = !ui.hidden; saveUi(); render(); });

  render();
  refreshQuotes();
})();
</script>
</body>
</html>
